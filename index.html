<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GradLab</title>
<meta name="description" content="Build CSS gradients visually and copy the code.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="assets/logo.svg" alt="" width="28" height="28"><span>GradLab</span></div>
  <button id="theme" class="icon" type="button" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><path d="M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z"/></svg></button>
</header>
<main>
  <section class="stage">
    <div id="preview" class="preview" role="img" aria-label="Gradient preview"></div>
    <pre class="code"><code id="css"></code></pre>
    <div class="row"><button id="copy" class="primary" type="button">Copy CSS</button><button id="random" type="button">Surprise me</button></div>
  </section>
  <section class="panel" aria-label="Controls">
    <div class="seg" id="types" role="group" aria-label="Gradient type"><button data-t="linear" type="button">Linear</button><button data-t="radial" type="button">Radial</button><button data-t="conic" type="button">Conic</button></div>
    <label id="angle-wrap" class="rng">Angle <output id="angle-out">135deg</output><input id="angle" type="range" min="0" max="360" value="135"></label>
    <h3>Color stops</h3>
    <div id="stops" class="stops"></div>
    <button id="add" type="button">Add stop</button>
    <h3>Presets</h3>
    <div id="presets" class="presets"></div>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
